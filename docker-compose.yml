services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: avc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avc_dev}
      POSTGRES_DB: ${POSTGRES_DB:-assistente_condominios}
    # Porta externa 5439 pra evitar conflito com outros Postgres locais.
    # Containers da própria stack se comunicam pela porta interna 5432.
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avc} -d ${POSTGRES_DB:-assistente_condominios}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: avc_redis
    restart: unless-stopped
    # Porta externa 6389 pra evitar conflito com outros Redis locais.
    ports:
      - "6389:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: avc_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-avc}:${POSTGRES_PASSWORD:-avc_dev}@postgres:5432/${POSTGRES_DB:-assistente_condominios}
      REDIS_URL: redis://redis:6379/0
      OPEN_AI_KEY: ${OPEN_AI_KEY}
      SECRET_KEY_JWT: ${SECRET_KEY_JWT}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./ingestion:/app/ingestion
      - ./data:/app/data        # storage local (uploads de PDF, etc.)
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: node:20-alpine
    container_name: avc_web
    restart: unless-stopped
    depends_on:
      - api
    working_dir: /app
    environment:
      # NEXT_PUBLIC_*: vai pro browser (do host) — cai no proxy do Next.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # INTERNAL_API_URL: usado server-side pelo rewrite — DNS interno docker.
      INTERNAL_API_URL: http://api:8000
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    command: sh -c "npm install && npm run dev"

volumes:
  postgres_data:
  redis_data:
  web_node_modules:
  web_next_cache:
